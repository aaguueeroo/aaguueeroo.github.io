<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    
  <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#FFF6DC"/>
    <stop offset="1" stop-color="#E3C66E"/>
  </linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0.55" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#F3EEE3"/>
  </linearGradient>
  <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFC6D4"/>
    <stop offset="1" stop-color="#F59DB6"/>
  </linearGradient>
  <clipPath id="headClip">
    <ellipse cx="0" cy="-30" rx="255" ry="245"/>
  </clipPath>

    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#4A7A53"/>
      <stop offset="0.6" stop-color="#2F5D3A"/>
      <stop offset="1" stop-color="#1F3F27"/>
    </radialGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="roundClip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  
    <rect x="100" y="112" width="824" height="824" rx="185" fill="#000000" opacity="0.28" filter="url(#shadow)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <g clip-path="url(#roundClip)"><g transform="translate(512 520) scale(0.72) translate(0 50)">
  <!-- ground shadow -->
  <ellipse cx="0" cy="330" rx="250" ry="34" fill="#0E1F12" opacity="0.22"/>

  <!-- horns and ears sit behind the head -->
  
  <path d="M -160 -205 C -232 -236 -270 -292 -250 -366
           C -220 -318 -176 -292 -95 -262 Z"
        fill="url(#horn)" stroke="#1F1A14" stroke-width="14" stroke-linejoin="round"/>
  <path d="M -200 -256 C -214 -274 -226 -296 -232 -320"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="12" stroke-linecap="round"/>

  <g transform="scale(-1 1)">
  <path d="M -160 -205 C -232 -236 -270 -292 -250 -366
           C -220 -318 -176 -292 -95 -262 Z"
        fill="url(#horn)" stroke="#1F1A14" stroke-width="14" stroke-linejoin="round"/>
  <path d="M -200 -256 C -214 -274 -226 -296 -232 -320"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="12" stroke-linecap="round"/>
</g>
  
  <g transform="translate(-282 -118) rotate(-14)">
    <ellipse cx="0" cy="0" rx="122" ry="58" fill="#FFFFFF" stroke="#1F1A14" stroke-width="14"/>
    <ellipse cx="-14" cy="4" rx="84" ry="32" fill="#F7A9BE"/>
  </g>

  <g transform="scale(-1 1)">
  <g transform="translate(-282 -118) rotate(-14)">
    <ellipse cx="0" cy="0" rx="122" ry="58" fill="#FFFFFF" stroke="#1F1A14" stroke-width="14"/>
    <ellipse cx="-14" cy="4" rx="84" ry="32" fill="#F7A9BE"/>
  </g>
</g>

  <!-- head -->
  <ellipse cx="0" cy="-30" rx="255" ry="245" fill="url(#head)" stroke="#1F1A14" stroke-width="14"/>

  <!-- spots, clipped to the head -->
  <g clip-path="url(#headClip)" fill="#1F1A14">
    <path d="M -300 -215 C -230 -250 -140 -228 -104 -168
             C -74 -116 -96 -48 -162 -38
             C -214 -30 -252 -62 -300 -40 Z"/>
    <path d="M 52 -300 C 110 -312 208 -280 196 -208
             C 186 -160 124 -168 98 -200
             C 72 -228 26 -246 52 -300 Z"/>
    <path d="M 290 -20 C 248 -30 214 6 226 44 C 238 80 282 84 300 60 Z"/>
  </g>
  <ellipse cx="0" cy="-30" rx="255" ry="245" fill="none" stroke="#1F1A14" stroke-width="14"/>

  <!-- tuft of hair -->
  <path d="M -64 -262 C -86 -300 -58 -338 -20 -318
           C -8 -352 44 -356 50 -318
           C 84 -326 102 -290 76 -262
           C 30 -278 -20 -278 -64 -262 Z"
        fill="#1F1A14" stroke="#1F1A14" stroke-width="10" stroke-linejoin="round"/>

  <!-- eyes -->
  
  <g transform="scale(1 1)">
    <ellipse cx="-105" cy="-72" rx="58" ry="66" fill="#FFFFFF" stroke="#1F1A14" stroke-width="14"/>
  </g>

  
  <g transform="scale(-1 1)">
    <ellipse cx="-105" cy="-72" rx="58" ry="66" fill="#FFFFFF" stroke="#1F1A14" stroke-width="14"/>
  </g>

  
  <circle cx="-96" cy="-62" r="37" fill="#1F1A14"/>
  <circle cx="-109" cy="-79" r="13" fill="#FFFFFF"/>
  <circle cx="-83" cy="-46" r="6" fill="#FFFFFF"/>

  
  <circle cx="114" cy="-62" r="37" fill="#1F1A14"/>
  <circle cx="101" cy="-79" r="13" fill="#FFFFFF"/>
  <circle cx="127" cy="-46" r="6" fill="#FFFFFF"/>


  <!-- blush -->
  <ellipse cx="-172" cy="36" rx="40" ry="22" fill="#F48DAC" opacity="0.75"/>
  <ellipse cx="172" cy="36" rx="40" ry="22" fill="#F48DAC" opacity="0.75"/>

  <!-- muzzle -->
  <ellipse cx="0" cy="160" rx="225" ry="140" fill="url(#muzzle)" stroke="#1F1A14" stroke-width="14"/>
  <ellipse cx="-70" cy="70" rx="70" ry="22" fill="#FFFFFF" opacity="0.45"/>
  <ellipse cx="-82" cy="130" rx="25" ry="35" transform="rotate(-18 -82 130)" fill="#C0527A"/>
  <ellipse cx="82" cy="130" rx="25" ry="35" transform="rotate(18 82 130)" fill="#C0527A"/>

  <!-- tongue and smile -->
  <path d="M 18 240 C 14 302 96 310 88 214 Z"
        fill="#E8577A" stroke="#1F1A14" stroke-width="12" stroke-linejoin="round"/>
  <path d="M 52 250 L 56 280" stroke="#B83A5E" stroke-width="8" stroke-linecap="round"/>
  <path d="M -98 208 Q 0 278 98 208"
        fill="none" stroke="#1F1A14" stroke-width="14" stroke-linecap="round"/>
</g></g>
</svg>