<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chotos — social image source</title>
<style>
@font-face { font-family: Bitter; src: url('/public/chotos/fonts/Bitter-Bold.ttf'); font-weight:700; }
@font-face { font-family: Atkinson; src: url('/public/chotos/fonts/AtkinsonHyperlegible-Regular.ttf'); }
@font-face { font-family: Atkinson; src: url('/public/chotos/fonts/AtkinsonHyperlegible-Bold.ttf'); font-weight:700; }
* { box-sizing: border-box; }
html, body { margin:0; width:1200px; height:630px; overflow:hidden; }
body { background:#f3eee3; color:#1f1a14; font-family:Atkinson,sans-serif; position:relative; }
.brand { position:absolute; left:64px; top:43px; display:flex; align-items:center; gap:14px; color:#2f5d3a; font:700 40px Bitter,serif; }
.brand img { width:54px; height:54px; border-radius:12px; }
h1 { position:absolute; left:64px; top:139px; margin:0; font:700 70px/1.14 Bitter,serif; letter-spacing:-2.5px; }
h1 span { color:#2f5d3a; }
.description { position:absolute; left:68px; top:397px; font-size:29px; line-height:1.35; color:#524839; margin:0; }
.footer { position:absolute; left:0; bottom:0; width:100%; height:82px; background:#2f5d3a; color:#fffdf8; display:flex; justify-content:space-between; align-items:center; padding:0 64px; font-size:24px; }
.footer strong { font-weight:700; }
.arch { position:absolute; right:35px; top:78px; width:366px; height:432px; border-radius:49% 49% 10px 10px; background:#dce4d3; transform:rotate(-5deg); }
.phone { position:absolute; top:35px; right:93px; width:231px; border:7px solid #39392e; border-radius:28px; overflow:hidden; background:#f3eee3; transform:rotate(3deg); box-shadow:0 13px 23px #1f1a141a; }
.phone img { display:block; width:100%; height:auto; }
.caption { position:absolute; right:67px; top:519px; width:290px; margin:0; font-size:14px; text-align:center; color:#524839; }
@media (height:600px) {
 html,body { height:600px; }
 .phone { top:30px; width:220px; right:99px; }
 .arch { top:65px; height:413px; }
 .caption { top:492px; }
 .footer { height:68px; }
 .brand { top:35px; }
 h1 { top:130px; }
 .description { top:385px; }
}
</style>
</head>
<body>
<div class="arch"></div>
<div class="brand"><img src="/public/chotos/icono.png" alt="">Chotos</div>
<h1>Tus vacas.<br>Sus historias.<br><span>Siempre a mano.</span></h1>
<p class="description">La app para llevar tu explotación.<br>Clara, sencilla y en tu móvil.</p>
<div class="phone"><img src="/public/chotos/images/lista.png" alt="Diseño de la lista de vacas"></div>
<p class="caption">Diseño de la app · Datos de ejemplo</p>
<div class="footer"><strong>¿Quieres participar en las primeras pruebas?</strong><span>juliaaguero.com/chotos</span></div>
</body>
</html>
