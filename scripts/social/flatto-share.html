<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flatto — social image source</title>
<style>
@font-face { font-family: Bricolage; src: url('../../public/flatto/fonts/bricolage-grotesque.woff2'); font-weight: 200 800; }
@font-face { font-family: Jakarta; src: url('../../public/flatto/fonts/plus-jakarta-sans.woff2'); font-weight: 200 800; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; background: #fbf6ef; color: #173f4a; font-family: Jakarta, sans-serif; }
.brand { position: absolute; left: 64px; top: 40px; display: flex; align-items: center; gap: 12px; font: 800 36px Bricolage, sans-serif; letter-spacing: -0.02em; }
.brand img { width: 54px; height: 54px; }
h1 { position: absolute; left: 64px; top: 138px; margin: 0; font: 800 80px/1.02 Bricolage, sans-serif; letter-spacing: -0.035em; white-space: nowrap; }
h1 span { display: block; color: #c4532a; }
.lead { position: absolute; left: 66px; top: 402px; margin: 0; font-size: 28px; font-weight: 500; color: #4f6b73; }
.footer { position: absolute; left: 0; bottom: 0; width: 100%; height: 76px; padding: 0 64px; display: flex; align-items: center; justify-content: space-between; background: #173f4a; color: #fbf6ef; font-size: 24px; }
.footer strong { font-weight: 700; }
.arch { position: absolute; right: 44px; top: 56px; width: 340px; height: 560px; border-radius: 999px 999px 0 0; background: #ffe6d9; }
.phone { position: absolute; right: 84px; top: 84px; width: 262px; overflow: hidden; border: 6px solid #0f2c34; border-radius: 40px; background: #fbf6ef; rotate: 3deg; box-shadow: 0 24px 40px -20px rgb(23 63 74 / 0.45); }
.phone img { display: block; width: 100%; height: auto; }
.tag { position: absolute; right: 44px; top: 66px; padding: 4px 12px; border-radius: 999px; background: #173f4a; color: #fff; font-size: 15px; font-weight: 700; rotate: 4deg; }
</style>
</head>
<body>
<div class="arch"></div>
<div class="brand"><img src="../../public/flatto/images/logo.png" alt="">Flatto</div>
<h1>Nobody wants to be<span>the flatmate</span><span>who nags.</span></h1>
<p class="lead">Chores, shopping and the flat chat in one app.</p>
<div class="phone"><img src="../../public/flatto/images/home-760.jpg" alt=""></div>
<div class="tag">Real app, demo flat.</div>
<div class="footer"><strong>Looking for the first flats to test it</strong><span>juliaaguero.com/flatto</span></div>
</body>
</html>
